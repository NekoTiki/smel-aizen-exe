; VRChat OSC -> ESP32 relay bridge
; Build/flash:  pio run -t upload   |   Serial monitor:  pio device monitor
; Other board:  pio run -e esp32dev -t upload   (or -e lolin_s3)
; PC twin:      pio run -e twin     then run .pio\build\twin\program.exe

[platformio]
default_envs = esp32-s3-devkitc-1

[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
build_src_filter = +<*> -<platform/native/>

; Espressif ESP32-S3-DevKitC-1 (docs/esp32-s3-devkitc-1.md). Plug into the port marked "UART".
; This setting fits the N8, N8R2 and N8R8 variants. For N16R8V / N32R8V (WROOM-2, octal flash),
; add:  board_build.arduino.memory_type = opi_opi
[env:esp32-s3-devkitc-1]
extends = esp32_base
board = esp32-s3-devkitc-1

; WEMOS LOLIN S3 (ESP32-S3-WROOM-1 N16R8: 16 MB flash, 8 MB octal PSRAM).
; Flash and monitor through the port marked "USB": this board prints its logs there, not on "UART".
; pio run -e lolin_s3 -t upload -t monitor
[env:lolin_s3]
extends = esp32_base
board = lolin_s3

; Generic ESP32 (WROOM-32) devkit
[env:esp32dev]
extends = esp32_base
board = esp32dev

; PC twin: the same core running on Windows, no hardware needed (docs/pc-twin.md).
; Needs a MinGW-w64 GCC on PATH. Run it with the "Run PC twin" task in the PlatformIO sidebar,
; or: pio run -e twin -t run_twin
[env:twin]
platform = native
extra_scripts = scripts/twin_targets.py
build_src_filter = +<*> -<platform/esp32/>
build_flags =
    -Wall
    -std=gnu++17
    -DTWIN_BOARD_ESP32S3
    -D_WIN32_WINNT=0x0A00
    -static
    -lws2_32
    -ldnsapi
