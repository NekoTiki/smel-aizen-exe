; VRChat OSC -> ESP32 relay bridge
; Build/flash:  pio run -t upload   |   Serial monitor:  pio device monitor
; Other board:  pio run -e esp32dev -t upload

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall

; Espressif ESP32-S3-DevKitC-1 (docs/esp32-s3-devkitc-1.md). Plug into the port marked "UART".
; This setting fits the N8, N8R2 and N8R8 variants. For N16R8V / N32R8V (WROOM-2, octal flash),
; add:  board_build.arduino.memory_type = opi_opi
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; Generic ESP32 (WROOM-32) devkit
[env:esp32dev]
board = esp32dev
